name: Deploy Enkephalos to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Deployment on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          # VPS Connection Details
          # Configure these in GitHub -> Repository Settings -> Secrets and variables -> Actions
          # or substitute directly with your values if desired:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 120s
          script_stop: true
          script: |
            echo "Iniciando deploy do Enkephalos (enkephalos.mubadev.com.br)..."
            mkdir -p /var/www
            if [ ! -d "/var/www/enkephalos/.git" ]; then rm -rf /var/www/enkephalos && git clone https://github.com/murilofsouzaa/enkephalos.git /var/www/enkephalos; fi
            cd /var/www/enkephalos && git fetch origin main && git reset --hard origin/main && git clean -fd
            chmod +x /var/www/enkephalos/scripts/deploy.sh
            /var/www/enkephalos/scripts/deploy.sh
