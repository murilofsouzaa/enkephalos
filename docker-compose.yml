services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enkephalos-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - enkephalos-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enkephalos-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - enkephalos-net

networks:
  enkephalos-net:
    driver: bridge
