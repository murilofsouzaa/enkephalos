# ==============================================================================
# NGINX Configuration for enkephalos.mubadev.com.br (VPS Host Reverse Proxy)
# Save this file to: /etc/nginx/sites-available/enkephalos.mubadev.com.br
# Symlink: sudo ln -s /etc/nginx/sites-available/enkephalos.mubadev.com.br /etc/nginx/sites-enabled/
# ==============================================================================

# 1. HTTP Server - Redirects all traffic to HTTPS (and serves Let's Encrypt challenge)
server {
    listen 80;
    listen [::]:80;
    server_name enkephalos.mubadev.com.br;

    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Reverse Proxy to Docker Container
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name enkephalos.mubadev.com.br;

    # SSL Certificates generated by Certbot
    ssl_certificate /etc/letsencrypt/live/enkephalos.mubadev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enkephalos.mubadev.com.br/privkey.pem;

    # Recommended Modern SSL Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Robust Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Performance buffers and sizes
    client_max_body_size 50M;

    # Proxy to Frontend Docker Container (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket and standard proxy headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # Proxy to Backend Spring Boot Container (Port 8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
